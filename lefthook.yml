# Lefthook configuration for semantic-cache-mcp
# Install: npm install -g @evilmartians/lefthook && lefthook install
# Or: brew install lefthook && lefthook install

# Every check here runs the same command CI runs, and blocks on the same
# result. A hook that passes what CI will fail is worse than no hook: it moves
# the discovery to the pull request. Lint rules come from pyproject.toml alone
# — no CLI --ignore list — so there is one place to change them.
#
# The split is by cost, not by strictness: pre-commit runs the fast checks on
# every commit, pre-push runs types and the suite once before the code leaves.
pre-commit:
  parallel: false
  commands:
    ruff-check:
      glob: "*.py"
      run: uv run python -m ruff check src/ tests/ --fix
      stage_fixed: true

    ruff-format:
      glob: "*.py"
      run: uv run python -m ruff format src/ tests/
      stage_fixed: true

    bandit:
      glob: "*.py"
      run: uv run python -m bandit -c pyproject.toml -r src/
      skip:
        - merge
        - rebase

pre-push:
  parallel: false
  commands:
    tests:
      run: uv run python -m pytest tests/ -x -q
      skip:
        - merge
        - rebase

    type-check:
      run: uv run python -m mypy src/
      skip:
        - merge
        - rebase

# Skip hooks for certain commit messages
skip_output:
  - meta
  - summary

commit-msg:
  commands:
    conventional-commit:
      run: |
        message=$(cat {1})
        if ! echo "$message" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+"; then
          echo "Commit message must follow Conventional Commits format:"
          echo "  <type>(<scope>): <description>"
          echo ""
          echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
          echo ""
          echo "Your message: $message"
          exit 1
        fi
