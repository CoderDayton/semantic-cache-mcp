[project]
name = "semantic-cache-mcp"
version = "0.7.0"
description = "MCP file cache for AI coding agents: re-reads cost ~40 tokens, changed files return diffs, grep and BM25 search over the cache"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CoderDayton" }]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "claude-code",
    "cursor",
    "codex",
    "ai-agents",
    "llm",
    "token-optimization",
    "context-window",
    "file-cache",
    "caching",
    "bm25",
    "grep",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "blake3>=1.0.8",
    "fastmcp>=4.0.0,<5",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/CoderDayton/semantic-cache-mcp"
Documentation = "https://github.com/CoderDayton/semantic-cache-mcp/tree/main/docs"
Changelog = "https://github.com/CoderDayton/semantic-cache-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/CoderDayton/semantic-cache-mcp/issues"

[project.optional-dependencies]
dev = [
    "bandit>=1.7.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
semantic-cache-mcp = "semantic_cache_mcp.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_cache_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E501",   # line too long
    "N806",   # variable in function should be lowercase
    "SIM108", # ternary operator
    "SIM102", # nested if
    "F841",   # local variable assigned but never used
    "B904",   # raise from within except
    "B905",   # zip without strict
    "UP028",  # yield from
    "E402",   # module level import not at top of file
    "C416",   # unnecessary list comprehension
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = [
    "B101",  # assert warnings (used in tests)
    "B310",  # urllib.urlretrieve - we use known hardcoded URL
    "B311",  # random - used for deterministic Gear hash table, not security
    "B608",  # SQL injection - false positive, we use parameterized placeholders
    "B110",  # try/except/pass - intentional for optional config files (pooling)
]
